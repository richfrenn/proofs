<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proofs · Readers' forum</title>
<meta name="description" content="Reader forum for Proofs, a novel by Richard Frenneaux.">
<style>
:root{
  --bg:#080b09; --panel:#0d120f; --panel2:#111814; --line:#1f2a23; --line2:#2b3a30;
  --ink:#c9d4c5; --dim:#7d8a80; --faint:#4d5a51;
  --acc:#6fe39a; --acc2:#3a7a52; --warn:#e0b04a; --red:#d56a5a;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono","Courier New","Noto Sans Mono CJK SC",monospace;
  --serif:"Iowan Old Style",Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;
}
html[data-theme="amber"]{ --acc:#ffb347; --acc2:#8a5a1c; --ink:#e3d6bf; --dim:#9a8b74; --faint:#5e5444; --line:#2a2318; --line2:#3a3020; --panel:#110e09; --panel2:#17130c; --bg:#0b0906; }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.55}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
button,input,textarea,select{font:inherit;color:inherit}
::selection{background:var(--acc);color:var(--bg)}

.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{border-bottom:1px solid var(--line2);background:linear-gradient(var(--panel2),var(--panel))}
.top .wrap{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-top:18px;padding-bottom:12px;flex-wrap:wrap}
.logo{color:var(--acc);font-size:15px;letter-spacing:.12em;text-transform:uppercase}
.logo small{display:block;color:var(--dim);letter-spacing:.08em;font-size:11px;text-shadow:none;margin-top:2px}
.tools{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.btn{background:transparent;border:1px solid var(--line2);color:var(--dim);padding:4px 9px;cursor:pointer}
.btn:hover,.btn.on{color:var(--acc);border-color:var(--acc2)}
.btn.primary{color:var(--bg);background:var(--acc);border-color:var(--acc)}
.btn.primary:hover{filter:brightness(1.1)}
.statusbar{border-bottom:1px solid var(--line);font-size:11px;color:var(--faint);background:var(--panel)}
.statusbar .wrap{display:flex;justify-content:space-between;gap:12px;padding-top:5px;padding-bottom:5px;flex-wrap:wrap}
.statusbar b{color:var(--dim);font-weight:normal}
.crumbs{margin:18px 0 12px;font-size:12px;color:var(--dim)}
.crumbs a{color:var(--dim)} .crumbs a:hover{color:var(--acc)}
.crumbs span{color:var(--faint);margin:0 6px}

/* notice */
.notice{border:1px dashed var(--line2);color:var(--dim);padding:8px 12px;font-size:12px;margin:14px 0}
.notice b{color:var(--warn);font-weight:normal}

/* board tables */
.tbl{width:100%;border-collapse:collapse;border:1px solid var(--line2);margin-bottom:22px;background:var(--panel)}
.tbl caption{text-align:left;padding:7px 10px;background:var(--panel2);border:1px solid var(--line2);border-bottom:0;color:var(--acc);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.tbl th{font-weight:normal;text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:6px 10px;border-bottom:1px solid var(--line2)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:color-mix(in srgb,var(--acc) 4%,transparent)}
.tbl .num{text-align:right;color:var(--dim);white-space:nowrap;width:70px}
.tbl .last{color:var(--dim);font-size:12px;width:200px}
.code{color:var(--faint);font-size:11px;margin-right:8px}
.bname{font-size:15px}
.bdesc{color:var(--dim);font-size:12px;margin-top:2px}
.tag{display:inline-block;font-size:10px;letter-spacing:.1em;border:1px solid var(--line2);color:var(--dim);padding:0 5px;margin-left:6px;vertical-align:1px;text-transform:uppercase}
.tag.new{color:var(--bg);background:var(--acc);border-color:var(--acc)}
.tag.lock{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.tag.pin{color:var(--acc);border-color:var(--acc2)}
tr.locked td{color:var(--faint)}
tr.locked a{color:var(--faint);pointer-events:none}
.count{color:var(--warn);font-variant-numeric:tabular-nums}

/* thread */
.thead{border:1px solid var(--line2);background:var(--panel2);padding:12px 14px;margin-bottom:0}
.thead h1{font-size:18px;font-weight:normal;margin:0;color:var(--ink)}
.thead .meta{font-size:12px;color:var(--dim);margin-top:4px}
.post{display:grid;grid-template-columns:170px 1fr;border:1px solid var(--line2);border-top:0;background:var(--panel)}
.post .who{border-right:1px solid var(--line);padding:12px;font-size:12px;color:var(--dim);background:var(--panel2)}
.post .who .h{color:var(--acc);font-size:13px;word-break:break-word}
.post .who .rank{margin-top:4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.post .body{padding:12px 14px;min-width:0}
.post .phead{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);border-bottom:1px dotted var(--line2);padding-bottom:6px;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.post .phead a{color:var(--faint)}
.post .txt{white-space:normal;word-wrap:break-word}
.post .txt p{margin:0 0 .8em}
.post .txt blockquote{margin:0 0 .8em;border-left:2px solid var(--acc2);padding:2px 10px;color:var(--dim)}
.post .actions{margin-top:8px;font-size:11px}
.post .actions button{background:none;border:0;color:var(--faint);cursor:pointer;padding:0;margin-right:12px}
.post .actions button:hover{color:var(--acc)}
.redact{background:var(--ink);color:transparent;cursor:pointer;padding:0 2px;border-radius:1px}
.redact.open{background:transparent;color:var(--warn);outline:1px dashed var(--warn)}
.post.admin .who .h{color:var(--warn)}

/* embedded reader */
.dossier{border:1px solid var(--line2);border-top:0;background:var(--panel)}
.dossier .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);flex-wrap:wrap}
.dossier .bar b{color:var(--acc);font-weight:normal}
.dossier audio{width:100%;display:block;height:34px;filter:invert(.9) hue-rotate(180deg) saturate(.4)}
html[data-theme="amber"] .dossier audio{filter:invert(.9) sepia(.6) hue-rotate(-10deg)}
.page{padding:28px 18px;max-height:none;overflow:hidden;position:relative;background:#0f1411;transition:max-height .3s}
html[data-theme="amber"] .page{background:#14110b}
.page.clipped{max-height:340px}
.page.clipped::after{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(transparent,var(--panel))}
.prose{max-width:640px;margin:0 auto;font-family:var(--serif);font-size:18px;line-height:1.75;color:#ddd6c8}
html[data-theme="amber"] .prose{color:#e8dcc4}
.prose p{margin:0;text-indent:1.4em}
.prose > p:first-of-type,.prose .brk + p,.prose .set + p,.prose .doc + p:not(.doc){text-indent:0}
.prose .doc{text-indent:0;margin:.5em 1.4em;color:#bfb8aa}
.prose .set{text-indent:0;text-align:center;margin:1em 0}
.prose .brk{text-indent:0;text-align:center;margin:1.2em 0;color:var(--dim)}
.prose h2{font-family:var(--mono);font-weight:normal;font-size:13px;letter-spacing:.3em;text-transform:uppercase;text-align:center;color:var(--acc);margin:0 0 22px}
.prose .epi{text-align:center;color:#9a958b;font-size:15px;margin:0 auto 28px;max-width:30em}
.prose .epi p{text-indent:0;margin:0 0 4px}
.prose .partcard{text-align:center;border:1px solid var(--line2);padding:16px;margin-bottom:30px;font-family:var(--mono);font-size:12px;color:var(--dim)}
.prose .partcard b{display:block;color:var(--acc);font-weight:normal;font-size:16px;letter-spacing:.2em;margin:4px 0}
html[lang="zh-CN"] .prose{font-size:17px;line-height:1.95;text-align:justify}
html[lang="zh-CN"] .prose p{text-indent:2em}
html[lang="zh-CN"] .prose .kai{font-family:"Kaiti SC","STKaiti","KaiTi",var(--serif)}
.expand{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--panel2);color:var(--acc);padding:8px;cursor:pointer;letter-spacing:.15em;font-size:12px}
.classified{border:1px solid var(--line2);border-top:0;background:var(--panel);padding:40px 16px;text-align:center}
.classified .stamp{display:inline-block;border:2px solid var(--red);color:var(--red);padding:4px 14px;letter-spacing:.3em;transform:rotate(-3deg);font-size:15px}
.classified .cd{font-size:22px;color:var(--warn);margin-top:16px;font-variant-numeric:tabular-nums}

/* composer */
.composer{border:1px solid var(--line2);background:var(--panel);margin:22px 0 40px}
.composer .hd{padding:7px 12px;background:var(--panel2);border-bottom:1px solid var(--line2);color:var(--acc);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.composer .bd{padding:12px}
.composer input,.composer textarea{width:100%;background:var(--bg);border:1px solid var(--line2);padding:8px 10px;outline:none;margin-bottom:8px}
.composer input:focus,.composer textarea:focus{border-color:var(--acc2)}
.composer textarea{min-height:130px;resize:vertical}
.composer .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--faint)}
.composer code{color:var(--dim)}
.empty{padding:20px;text-align:center;color:var(--faint);border:1px solid var(--line2);border-top:0;background:var(--panel)}
/* case-file layer */
.sech{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);padding:8px 12px;border:1px solid var(--line2);border-top:0;background:var(--panel2)}
.filehead{display:flex;justify-content:space-between;gap:10px;font-size:11px;letter-spacing:.2em;color:var(--faint);margin-top:6px}
.exh{border:1px solid var(--line2);border-top:0;background:var(--panel);padding:0 0 4px}
.exh .sech{border:0;border-bottom:1px solid var(--line)}
.exhibit{margin:14px 14px 10px}
.exhibit figcaption{font-size:12px;color:var(--ink);margin-bottom:6px}
.exhibit figcaption .src{color:var(--faint);font-size:11px;margin-left:6px}
.paper{background:#dcd7ca;color:#1d1c19;font-family:"Courier New",Courier,var(--mono);padding:30px 18px 16px;box-shadow:0 2px 0 rgba(0,0,0,.4);position:relative;font-size:13.5px;line-height:1.55}
html[data-theme="amber"] .paper{background:#e2d7bf}
.paper::after{content:attr(data-stamp);position:absolute;top:10px;right:12px;font-size:10px;letter-spacing:.25em;color:#8a2b22;border:1px solid #8a2b22;padding:1px 6px;transform:rotate(3deg)}
.paper dl.rec{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:0}
.paper dl.rec dt{color:#55524a}
.paper dl.rec dd{margin:0;font-weight:bold}
.paper table{border-collapse:collapse;width:100%}
.paper table td,.paper table th{border-bottom:1px solid #b9b3a3;padding:4px 6px;text-align:left;font-size:13px}
.paper table th{font-weight:normal;color:#55524a;letter-spacing:.08em}
.paper table.log tr.stop td{color:#8a2b22;font-weight:bold}
.paper table.log tr.gap td{text-align:center;color:#7a766b;border-bottom:0}
.paper table.wb{font-family:"Comic Sans MS","Chalkboard SE","Marker Felt",var(--mono)}
.paper table.wb tr.open td{height:26px;background:rgba(138,43,34,.06)}
.paper .form-h,.paper .cap-id,.paper .ms-head{font-size:11px;letter-spacing:.2em;color:#55524a;margin-bottom:10px}
.paper .cap-id{font-size:14px;letter-spacing:.06em;color:#1d1c19;font-weight:bold}
.paper .form-name{margin:12px 0 6px;font-weight:bold;letter-spacing:.1em}
.paper .sig{font-size:12px;color:#55524a}
.paper .unsigned{color:#8a2b22;border:1px solid #8a2b22;padding:0 4px;margin-left:6px;font-size:10px;letter-spacing:.15em}
.paper .note{font-family:"Bradley Hand","Segoe Print","Kaiti SC","STKaiti",cursive;font-size:16px}
.paper .note p{margin:0 0 4px}.paper .note .sign{margin-top:10px;font-size:13px;color:#55524a}
.paper .ms{font-family:var(--serif)}.paper .ms-line{font-style:italic;font-size:22px;margin:8px 0 12px}
.paper .ms-note{font-size:12px;color:#55524a;font-family:"Courier New",monospace}
.paper p{margin:0 0 8px}
.qs{border:1px solid var(--line2);border-top:0;background:var(--panel)}
.qs .sech{border:0;border-bottom:1px solid var(--line)}
.qrow{display:flex;gap:10px;align-items:baseline;justify-content:space-between;padding:10px 12px;border-bottom:1px dotted var(--line2)}
.qrow:last-child{border-bottom:0}
.qrow span.q{flex:1}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border:1px solid var(--line2);border-top:0;background:var(--panel2);font-size:11px}
.kind{font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line2);padding:0 5px;margin-right:8px}
.kind.k-observation{color:var(--acc)}.kind.k-theory{color:var(--warn)}.kind.k-question{color:#8fb7e8}.kind.k-outside{color:var(--dim)}
.kinds{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-bottom:8px;align-items:center}
.kinds label{cursor:pointer;white-space:nowrap}.composer .kinds input[type=radio]{width:auto;margin:0 4px 0 0;padding:0;accent-color:var(--acc);vertical-align:-1px}
.redbar{border:1px solid var(--line2);border-top:0;background:var(--panel);padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.redbar .bar{flex:1;min-width:160px;height:14px;background:var(--ink);opacity:.85}
.redbar .lbl{font-size:11px;color:var(--warn);letter-spacing:.12em}
.composer select{background:var(--bg);border:1px solid var(--line2);padding:4px 6px;color:var(--ink)}
footer{border-top:1px solid var(--line);color:var(--faint);font-size:11px;padding:16px 0 40px;margin-top:30px}
.pager{display:flex;justify-content:space-between;margin:10px 0 0;font-size:12px}

@media (max-width:640px){
  .post{grid-template-columns:1fr}
  .post .who{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;padding:8px 12px}
  .post .who .rank{margin:0}
  .tbl .last{display:none}
  .tbl th.lastc{display:none}
  .prose{font-size:17px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="logo">PROOFS // READERS' FORUM<small id="sub">Discussion of the novel by Richard Frenneaux</small></div>
  <div class="tools">
    <a class="btn" href="index.html" id="readerLink">READER</a>
    <button class="btn" data-lang="en">EN</button><button class="btn" data-lang="zh">中文</button>
    <button class="btn" id="themeBtn">AMBER</button>
    <button class="btn" id="whoBtn">SIGN IN</button>
  </div>
</div></header>
<div class="statusbar"><div class="wrap"><span id="statusL"></span><span id="statusR"></span></div></div>
<main class="wrap" id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>

<script src="chapters.js?v=2026-11-06a"></script>
<script>
/* =========================================================================
   CONFIG: edit announcements here. Board posts by you live in this file;
   reader posts go through the storage adapter below.
   ========================================================================= */
const FORUM = {
  admin: 'Richard Frenneaux',
  announcements: [
    { id:'welcome', pinned:true, date:'2026-10-31T20:00:00+08:00',
      title:{en:'Read me first: how this board works', zh:'请先阅读：本论坛使用说明'},
      body:{en:'Welcome to the forum for readers of *Proofs*.\n\nPart One of *Proofs* is serialised here, free: two chapters every Friday at 20:00 Beijing time, with audio. Each chapter gets its own thread under Chapter Discussions, with the text and the recording.\n\nSpoilers: wrap anything beyond the latest chapter in [redact]like this[/redact]. Readers click to reveal it.\n\nBe kind to each other. Disagree about identity as much as you like.',
            zh:'欢迎来到《复本》读者论坛。\n\n《复本》第一部在这里免费连载：每周五北京时间20:00更新两章，附有声朗读。中文译本为初稿，欢迎指出译文问题（帖子类型选“书外”）。每一章在“章节讨论”里都有自己的讨论帖，附正文与录音。\n\n剧透：超出最新章节的内容，请用 [redact]这样[/redact] 包起来，读者点击才会显示。\n\n彼此友善。关于“我是谁”，尽管争论。'} },
    { id:'schedule', pinned:false, date:'2026-10-31T20:00:00+08:00',
      title:{en:'Release schedule: 30 Oct 2026 to 25 Jun 2027', zh:'更新时间表：2026年10月30日至2027年6月25日'},
      body:{en:'Part One, The Step, two chapters every Friday at 20:00 Beijing time:\n\n6 November: Prologue, Chapters One and Two\n13 November: Chapters Three and Four\n20 November: Chapters Five and Six\n27 November: Chapters Seven and Eight\n4 December: Chapters Nine and Ten\n11 December: Chapters Eleven and Twelve\n18 December: Chapters Thirteen and Fourteen\n25 December: Chapters Fifteen and Sixteen, the end of Part One',
            zh:'第一部《台阶》，每周五北京时间20:00更新两章：\n\n11月6日：序章、第一章、第二章\n11月13日：第三、四章\n11月20日：第五、六章\n11月27日：第七、八章\n12月4日：第九、十章\n12月11日：第十一、十二章\n12月18日：第十三、十四章\n12月25日：第十五、十六章，第一部完'} }
  ]
};

/* =========================================================================
   STORAGE ADAPTER
   LocalAdapter keeps posts in this browser only (for building and testing).
   For a live forum, swap in a backend adapter with the same four methods.
   ========================================================================= */
const LocalAdapter = (() => {
  const KEY='proofs.forum.v1'; let mem=null;
  const load=()=>{ if(mem) return mem; try{ mem=JSON.parse(localStorage.getItem(KEY))||{threads:[],posts:{}}; }catch(e){ mem={threads:[],posts:{}}; } return mem; };
  const save=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch(e){} };
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  return {
    name:'LOCAL',
    async listThreads(board){ return load().threads.filter(t=>t.board===board).sort((a,b)=>b.updated.localeCompare(a.updated)); },
    async createThread(board,title,body,user,meta={}){ const d=load(); const id=board+'-'+uid(); const now=new Date().toISOString();
      d.threads.push({id,board,title,author:user,created:now,updated:now,ch:meta.ch??null}); d.posts[id]=[{id:uid(),author:user,body,date:now,kind:meta.kind||null,ch:meta.ch??null}]; save(); return id; },
    async listPosts(threadId){ return (load().posts[threadId]||[]).slice(); },
    async addPost(threadId,body,user,meta={}){ const d=load(); const now=new Date().toISOString();
      (d.posts[threadId]=d.posts[threadId]||[]).push({id:uid(),author:user,body,date:now,kind:meta.kind||null,ch:meta.ch??null});
      const t=d.threads.find(x=>x.id===threadId); if(t) t.updated=now; save(); },
    async getThread(id){ return load().threads.find(t=>t.id===id)||null; },
    async counts(){ const d=load(), m={}; for(const k in d.posts) m[k]=d.posts[k].length; return m; }
  };
})();

/* -------------------------------------------------------------------------
   SupabaseAdapter: shared posts for everyone. Fill in SUPABASE below
   (Project Settings > API in Supabase). Leave blank to stay in test mode.
   The anon key is meant to be public; the database rules in
   supabase_setup.sql decide what visitors may do.
   ------------------------------------------------------------------------- */
const SUPABASE = { url:'https://cmpfgetddlunkegujotj.supabase.co', anonKey:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNtcGZnZXRkZGx1bmtlZ3Vqb3RqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNjI2MTYsImV4cCI6MjEwODkzODYxNn0.u1tvnFIB8HLpavg4ASd-xu8YJOHNt7_i61iSAkQC0gw' };

const SupabaseAdapter = (() => {
  const H=()=>({ apikey:SUPABASE.anonKey, Authorization:'Bearer '+SUPABASE.anonKey, 'Content-Type':'application/json' });
  const api=async(path,opt={})=>{
    const r=await fetch(SUPABASE.url.replace(/\/$/,'')+'/rest/v1/'+path,{...opt,headers:{...H(),...(opt.headers||{})}});
    if(!r.ok) throw new Error('store '+r.status+': '+(await r.text()).slice(0,200));
    const txt=await r.text(); return txt?JSON.parse(txt):null;
  };
  const enc=encodeURIComponent;
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const mapPost=p=>({id:p.id,author:p.author,body:p.body,date:p.created,kind:p.kind,ch:p.ch});
  let countCache=null;
  return {
    name:'ONLINE',
    async listThreads(board){ return api('threads?select=*&board=eq.'+enc(board)+'&order=updated.desc'); },
    async createThread(board,title,body,user,meta={}){
      const id=board+'-'+uid();
      await api('threads',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({id,board,title,author:user,ch:meta.ch??null})});
      await api('posts',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({thread_id:id,author:user,body,kind:meta.kind||null,ch:meta.ch??null})});
      countCache=null; return id;
    },

function wireComposer(fn){
  const b=$('#csend'); if(!b) return;
  b.onclick=async()=>{
    if(!user && !signIn()) return;
    const title=$('#ctitle')?$('#ctitle').value.trim():''; const body=$('#cbody').value.trim();
    if(!body || ($('#ctitle')&&!title)) return;
    b.disabled=true;
    const kr=document.querySelector('input[name="ckind"]:checked'); const kind=kr?kr.value:'observation';
    const cs=$('#cch'); const chSel=cs?+cs.value:null;

  };
}

function crumbs(items){
  let h='<div class="crumbs"><a href="#/">'+t('index')+'</a>';
  items.forEach(([n,href])=>{ h+='<span>›</span>'+(href?'<a href="'+href+'">'+esc(n)+'</a>':esc(n)); });
  window.__crumbs=h+'</div>';
}
function chrome(){
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  document.documentElement.dataset.theme=theme;
  document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  $('#themeBtn').textContent=theme==='green'?'AMBER':'GREEN';
  $('#whoBtn').textContent=user?('◉ '+user):t('signin');
  $('#readerLink').textContent=t('reader');
  $('#statusL').innerHTML=t('online')+': <b>'+(user?esc(user):'guest')+'</b> · store: <b>'+STORE.name+'</b>'+(PREVIEW?' · <b style="color:var(--warn)">PREVIEW</b>':'');
  $('#foot').innerHTML='PROOFS © 2026 Richard Frenneaux · '+(lang==='zh'?'复本':'Proofs')+' · <a href="index.html">'+t('reader')+'</a>';
}
async function route(){
  chrome();
  const hsh=location.hash.replace(/^#\/?/,'');
  const [kind,arg]=hsh.split('/');
  try{
    if(kind==='b' && L.en.B[arg]) await viewBoard(arg);
    else if(kind==='t' && arg) await viewThread(arg);
    else await viewIndex();
  }catch(e){ window.__crumbs=''; $('#app').innerHTML='<div class="notice"><b>ARCHIVE OFFLINE.</b> '+esc(e.message)+'</div>'; }
  $('#app').insertAdjacentHTML('afterbegin',window.__crumbs||'');
  document.querySelectorAll('.redact').forEach(r=>r.onclick=()=>r.classList.toggle('open'));
  clearInterval(timer); tick(); timer=setInterval(tick,1000);
  if(!kind) window.scrollTo(0,0);
}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; try{localStorage.setItem('proofs.lang',lang);}catch(e){} route(); });
$('#themeBtn').onclick=()=>{ theme=theme==='green'?'amber':'green'; try{localStorage.setItem('proofs.theme',theme);}catch(e){} chrome(); };
$('#whoBtn').onclick=()=>signIn();
window.addEventListener('hashchange',()=>{ route(); window.scrollTo(0,0); });
if(!BOOK) document.getElementById('app').innerHTML='<p>chapters.js not found.</p>'; else route();
</script>
</body>
</html>
